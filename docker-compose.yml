services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
  
  datascience:
    build:
      context: ./datascience
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

    volumes:
      - ./dataScience/.oci:/root/.oci:ro

    env_file:
      - ./datascience/.env